<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বৃত্তি মডেল টেস্ট ফলাফল</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--brand:#0f766e;--navy:#0b2a6b}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e8eef8;--mut:#93a1b8;--line:#243049;--brand:#2dd4bf;--navy:#cfe0ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:18px 14px 40px;line-height:1.55}
.wrap{width:100%;max-width:520px}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 40px rgba(15,23,42,.10);padding:26px 20px 24px;text-align:center;border:1px solid var(--line)}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px;background:#fff}
.ct{font-size:23px;font-weight:800;color:var(--navy);margin:6px 0 2px;line-height:1.3}
.tt{font-size:16px;font-weight:600;color:var(--mut);margin:0 0 18px}
.sf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;margin:0}
.sf input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:600;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none;text-align:center;letter-spacing:.04em}
.sf input:focus{border-color:var(--brand)}
.sf button{font:inherit;font-weight:700;font-size:16px;padding:0 20px;border:0;border-radius:14px;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;cursor:pointer}
.sf button:active{transform:scale(.97)}
.sf button[disabled]{opacity:.6}
.hint{grid-column:1;font-size:13px;color:var(--mut);margin:0;text-align:center}
.msg{margin:18px 0 0;padding:14px;border-radius:14px;background:#fef3c7;color:#92400e;font-weight:600;font-size:15px}
@media(prefers-color-scheme:dark){.msg{background:#3a2f0b;color:#fde68a}}
.res{margin-top:22px;text-align:left;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row{display:grid;grid-template-columns:42% 1fr;gap:10px;padding:9px 2px;font-size:16px;border-bottom:1px dashed var(--line)}
.row:last-of-type{border-bottom:0}
.row span{color:var(--mut)}
.row b{font-weight:600}
.fl{text-align:center;font-weight:600;margin:22px 0 10px;font-size:17px}
.box{margin:0 auto;max-width:300px;border-radius:18px;padding:20px 16px 16px;text-align:center;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.box b{display:block;font-size:30px;font-weight:800;line-height:1.25;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.55)}
.box small{display:block;font-size:19px;font-weight:600;margin-top:9px}
.t{background:linear-gradient(180deg,#22a74f,#16873d)}
.g{background:linear-gradient(180deg,#27a9c6,#1b8ca6)}
.n{background:linear-gradient(180deg,#8a94a6,#6b7587)}
.note{margin:22px 0 0;font-size:13.5px;color:var(--mut);text-align:center}
.note p{margin:4px 0}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:16px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.cd{margin:20px 0 0;padding:18px 12px;border-radius:18px;background:linear-gradient(135deg,#0f766e,#0b5f58);color:#fff;text-align:center}
.cd small{display:block;font-size:14px;opacity:.9;margin-bottom:8px}
.cd .tm{display:flex;justify-content:center;gap:8px;direction:ltr}
.cd .tm div{min-width:62px;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 4px}
.cd .tm b{display:block;font-size:28px;font-weight:800;line-height:1.2}
.cd .tm i{font-style:normal;font-size:12px;opacity:.85}
.cd p{margin:10px 0 0;font-size:13.5px;opacity:.95}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase কনফিগ (Firebase Console → Project settings → Your apps) ===== */
const FB_CONFIG = {apiKey:"AIzaSyD1E4aP33VOZ-udF8mghUeJIUXfgm8U7g8",authDomain:"tpc-britti.firebaseapp.com",projectId:"tpc-britti",storageBucket:"tpc-britti.firebasestorage.app",messagingSenderId:"969573714270",appId:"1:969573714270:web:7870f03fc83519fe64e7cf"};
/* ========================================================================= */
const $=s=>document.querySelector(s);
const en=s=>String(s==null?'':s).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
const bn=s=>String(s==null?'':s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normRoll=s=>en(s).replace(/[\s\/\\.#?\[\]]+/g,'').toLowerCase();
const B=new URLSearchParams(location.search).get('b')||'';
let db=null,ready=false,batch=null,openMs=0,tick=null;
function say(h){$('#out').innerHTML=h}
function warn(t){say(`<div class="msg">${esc(t)}</div>`)}
async function init(){
  if(!FB_CONFIG||!FB_CONFIG.projectId){warn('পাতাটি এখনো প্রস্তুত নয়।');return}
  if(!B){warn('সঠিক লিংক ব্যবহার করুন — সেন্টারের দেওয়া লিংকটি খুলুন।');return}
  try{
    firebase.initializeApp(FB_CONFIG);db=firebase.firestore();
    const d=await db.collection('britti').doc(B).get();
    if(!d.exists){warn('এই লিংকটি বন্ধ আছে বা সঠিক নয়।');return}
    batch=d.data();ready=true;
    if(batch.center)$('#ct').textContent=batch.center;
    if(batch.title){$('#tt').textContent=batch.title;document.title=batch.title}
    const oa=batch.openAt;openMs=oa&&oa.toMillis?oa.toMillis():(+oa||0);
    if(openMs>Date.now())lock();else $('#q').focus();
  }catch(e){warn('ইন্টারনেট সংযোগ দেখুন, তারপর আবার চেষ্টা করুন।')}
}
function lock(){
  const q=$('#q'),g=$('#go'),c=$('#cd');q.disabled=g.disabled=true;c.classList.remove('hide');
  const P=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dhaka',day:'numeric',month:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(openMs)).map(x=>[x.type,x.value]));
  const MO=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'],H=+P.hour,per=H>=4&&H<12?'সকাল':H>=12&&H<15?'দুপুর':H>=15&&H<18?'বিকাল':H>=18&&H<20?'সন্ধ্যা':'রাত';
  const when=bn(P.day)+' '+MO[P.month-1]+' '+bn(P.year)+', '+per+' '+bn(H%12||12)+':'+bn(P.minute);
  const pad=n=>bn(String(n).padStart(2,'0'));
  const draw=()=>{const left=openMs-Date.now();
    if(left<=0){clearInterval(tick);c.classList.add('hide');q.disabled=g.disabled=false;q.focus();return}
    const s=Math.floor(left/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
    c.innerHTML=`<small>ফলাফল প্রকাশ হবে</small><div class="tm">${d?`<div><b>${bn(d)}</b><i>দিন</i></div>`:''}<div><b>${pad(h)}</b><i>ঘণ্টা</i></div><div><b>${pad(m)}</b><i>মিনিট</i></div><div><b>${pad(x)}</b><i>সেকেন্ড</i></div></div><p>${esc(when)}</p>`};
  draw();clearInterval(tick);tick=setInterval(draw,1000)}
function box(rs){
  if(rs==='T')return`<div class="box t"><b>ট্যালেন্টপুল</b><small>বৃত্তিপ্রাপ্ত</small></div>`;
  if(rs==='G')return`<div class="box g"><b>সাধারণ</b><small>বৃত্তিপ্রাপ্ত</small></div>`;
  return`<div class="box n"><b style="border:0;padding:6px 0">বৃত্তি প্রযোজ্য নয়</b></div>`}
async function find(e){
  e.preventDefault();
  if(!ready){await init();if(!ready)return}
  const roll=normRoll($('#q').value);
  if(!roll){warn('রোল নম্বর লিখুন।');return}
  const btn=$('#go');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  try{
    const d=await db.collection('britti').doc(B).collection('r').doc(roll).get();
    if(!d.exists){warn('এই রোল নম্বরে কোনো ফলাফল পাওয়া যায়নি। রোল নম্বর আবার দেখে লিখুন।');return}
    const x=d.data(),row=(l,v)=>v?`<div class="row"><span>${l}</span><b>${esc(v)}</b></div>`:'';
    say(`<div class="res">${row('পরীক্ষার্থীর নাম',x.n)}${row('রোল নম্বর',bn(x.rl||roll))}${row('বিদ্যালয়ের নাম',x.sc)}${row('উপজেলা/থানা',x.up)}${row('জেলা',x.dt)}${row('বিভাগ',x.dv)}${row('পরীক্ষার সন',bn(batch.yr||''))}<div class="fl">ফলাফল</div>${box(x.rs)}</div>`);
  }catch(err){warn(err&&err.code==='permission-denied'?'ফলাফল এখনো প্রকাশ হয়নি। একটু পরে আবার চেষ্টা করুন।':'ফলাফল আনা যায়নি। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।')}
  finally{btn.disabled=false;btn.textContent='খুঁজুন'}
}
$('#f').addEventListener('submit',find);
window.addEventListener('load',init);
</script>
</body>
</html>
